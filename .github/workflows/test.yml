name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, Format, Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Download dependencies
        run: devenv shell -- go mod download

      - name: Run git hooks
        run: devenv tasks run devenv:git-hooks:run --show-output

      - name: Check formatting
        run: |
          make format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted. Please run 'make format'"
            git diff
            exit 1
          fi

      - name: Verify dependencies
        run: |
          devenv shell -- go mod verify
          devenv shell -- go mod tidy
          git diff --exit-code go.mod go.sum

  # Platform integration tests
  integration-tests:
    name: Integration with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Download dependencies
        run: devenv shell -- go mod download

      - name: Run all tests (including integration)
        run: devenv shell -- go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Caddy with module
        run: devenv shell -- make caddy

      - name: Validate test configuration
        run: devenv shell -- ./build/caddy validate --config testdata/test-config.yaml --adapter yaml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration,${{ runner.os }}
          name: ${{ runner.os }}
